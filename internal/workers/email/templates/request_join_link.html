<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Join Program</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #0d1e43; margin: 0; padding: 40px 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .logo { font-size: 24px; font-weight: bold; color: #10b981; margin-bottom: 24px; text-align: center; }
        h1 { font-size: 20px; font-weight: bold; margin-top: 0; margin-bottom: 8px; color: #0d1e43; text-align: center; }
        p { font-size: 15px; line-height: 24px; color: #475569; margin-top: 0; margin-bottom: 24px; text-align: center; }
        .btn-container { text-align: center; margin-bottom: 24px; }
        .btn { display: inline-block; background-color: #10b981; color: #ffffff !important; font-weight: bold; text-decoration: none; padding: 12px 28px; border-radius: 12px; font-size: 16px; transition: background-color 0.2s; }
        .link-fallback { font-size: 12px; color: #64748b; word-break: break-all; margin-top: 24px; text-align: center; }
        .footer { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 32px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Pivote</div>
        <h1>Join Voting Program</h1>
        <p>You have been requested to join a voting program on Pivote. Click the button below to join:</p>
        <div class="btn-container">
            <a href="{{.JoinLink}}" class="btn">Join Program</a>
        </div>
        <div class="link-fallback">
            If the button doesn't work, copy and paste this link into your browser:<br>
            <a href="{{.JoinLink}}" style="color: #10b981;">{{.JoinLink}}</a>
        </div>
    </div>
    <div class="footer">&copy; 2026 Pivote. All rights reserved.</div>
</body>
</html>
