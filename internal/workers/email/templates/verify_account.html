<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Verify your Account</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #0d1e43; margin: 0; padding: 40px 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .logo { font-size: 24px; font-weight: bold; color: #10b981; margin-bottom: 24px; text-align: center; }
        h1 { font-size: 20px; font-weight: bold; margin-top: 0; margin-bottom: 8px; color: #0d1e43; text-align: center; }
        p { font-size: 15px; line-height: 24px; color: #475569; margin-top: 0; margin-bottom: 24px; text-align: center; }
        .code-box { background-color: #f1f5f9; border: 1px solid #e2e8f0; padding: 16px; border-radius: 12px; font-size: 28px; font-weight: bold; letter-spacing: 4px; text-align: center; color: #0d1e43; margin-bottom: 24px; }
        .footer { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 32px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Pivote</div>
        <h1>Verify your Account</h1>
        <p>Thank you for signing up for Pivote. Please use the verification code below to complete your registration:</p>
        <div class="code-box">{{.Otp}}</div>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 0; text-align: center;">If you didn't request this, you can safely ignore this email.</p>
    </div>
    <div class="footer">&copy; 2026 Pivote. All rights reserved.</div>
</body>
</html>
